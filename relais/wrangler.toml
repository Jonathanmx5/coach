name = "coach-relais"
main = "src/index.js"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"

# Compteurs d'usage : npx wrangler kv namespace create LIMITES, puis coller l'id.
[[kv_namespaces]]
binding = "LIMITES"
id = "ca1b497c69f844df9fe098c9d5e66c4a"

[vars]
PROJECT_ID = "coach-jonathanmx5"
MODELE = "@cf/meta/llama-3.2-11b-vision-instruct"
# Si le modèle principal ne renvoie rien d'exploitable (texte libre au lieu de JSON).
MODELE_SECOURS = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Photos analysées par jour : par utilisateur, et pour tout le monde (garde-fou
# grossier du coût ; à recalculer avec l'usage journalisé par requête).
# Une analyse qui échoue (panne, illisible, délai) rend son unité.
PLAFOND_UTILISATEUR = "30"
PLAFOND_GLOBAL = "500"
# App Check : "off", "observe" (note les appels sans preuve) ou "enforce"
# (les refuse). PROJECT_NUMBER : numéro du projet Firebase (Paramètres du projet).
# « observe » pour mesurer ; « enforce » seulement après la sortie Play Store.
APP_CHECK = "observe"
# Fournisseur d'IA : "gemini" (si le secret GEMINI_API_KEY existe) ou "workers".
FOURNISSEUR = "gemini"
GEMINI_MODELE = "gemini-3.8-flash"
PROJECT_NUMBER = "67566402702"
